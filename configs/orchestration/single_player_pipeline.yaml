# Stage 14 — single-player E2E orchestration policy
schema_version: 1
pipeline_version: 1
name: single_player_analysis
product: single_player_report_v1

stages:
  - ingest
  - probe
  - normalize
  - timeline
  - broadcast
  - detection
  - tracking
  - identity
  - calibration
  - physical
  - interaction
  - passing
  - events
  - report

rules:
  fingerprint_checks: true
  deterministic_cache_keys: true
  resume_restart: true
  no_overwrite: true
  failure_isolation: true
  partial_status: true
  stale_rejection: true
  cancellation_receipt: true
  bounded_memory: true
  cleanup_stage_owned_temp_only: true
  never_mutate_user_video: true
  synthetic_fixture_allowed: true
  real_football_accuracy_validated: false

cache:
  enabled: true
  key_algorithm: sha256_canonical_json
  reject_stale_fingerprint_mismatch: true

memory:
  max_in_memory_frames: 0
  prefer_streaming_artifacts: true
  max_stage_summary_bytes: 1048576

paths:
  reserved_final_customer_visuals:
    - /home/fdoblak/football_data/rendered_outputs/final/single_player_analysis_summary.png
    - artifacts/final/single_player_analysis_summary.png
  note: "Stage 16 only — do not commit synthetic renders as final customer visuals"

gate_hint: >-
  PASS_WITH_FINDINGS — SINGLE PLAYER PIPELINE ACTIVE; STAGE 14 CLOSED;
  REAL FOOTBALL ACCURACY NOT YET VALIDATED
